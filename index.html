<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Từ vựng A1</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mute:#6e6e73; --line:#e5e5ea; --card:#f5f5f7; --accent:#2f6fde; --good:#1a8f3c; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --mute:#a0a0a6; --line:#2c2c2e; --card:#1c1c1e; --accent:#5b8ff0; --good:#3fbf62; --bad:#ef5350; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 system-ui,-apple-system,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px 16px 48px; }
  h1 { font-size:22px; margin:8px 0 4px; } h2 { font-size:18px; margin:20px 0 8px; }
  .mute { color:var(--mute); font-size:14px; }
  .bar { height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin:4px 0 2px; position:relative; }
  .bar i { display:block; height:100%; border-radius:5px; }
  .bar b { position:absolute; top:0; bottom:0; width:2px; background:var(--fg); opacity:.5; }
  .box { background:var(--card); border-radius:12px; padding:14px; margin:12px 0; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:10px; padding:12px 14px; cursor:pointer; width:100%; text-align:left; margin:6px 0; }
  button.pri { background:var(--accent); border-color:var(--accent); color:#fff; text-align:center; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  button.ok { border-color:var(--good); background:color-mix(in srgb,var(--good) 15%,var(--card)); }
  button.no { border-color:var(--bad); background:color-mix(in srgb,var(--bad) 15%,var(--card)); }
  button.link { border:0; background:none; color:var(--accent); width:auto; padding:4px 0; }
  input { font:inherit; width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); margin:6px 0; }
  .big { font-size:40px; font-weight:800; letter-spacing:-.5px; } .pic { font-size:64px; line-height:1.2; }
  .q { font-size:24px; font-weight:700; margin:14px 0 6px; line-height:1.35; }
  .top { position:sticky; top:0; background:var(--bg); padding:6px 0; z-index:5; }
  .uname { font-size:14px; font-weight:600; color:var(--accent); text-align:right; max-width:70%; }
  .dots { display:flex; gap:6px; justify-content:center; margin:8px 0; }
  .dots i { width:8px; height:8px; border-radius:50%; background:var(--line); }
  .dots i.d { background:var(--good); } .dots i.c { background:var(--accent); width:20px; border-radius:4px; }
  .wcard { background:var(--card); border-radius:20px; padding:24px 16px 16px; margin:8px 0 14px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .wcard .vi { font-size:24px; font-weight:700; margin:10px 0; }
  .wcard .ex { font-size:19px; margin:12px 0; }
  .chips.say { justify-content:center; margin-top:10px; }
  .opt { font-size:19px; padding:14px 16px; }
  .tin { font-size:22px; padding:14px; text-align:center; }
  .tin.ok { border-color:var(--good); } .tin.no { border-color:var(--bad); }
  button.pri { font-size:18px; padding:14px; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .units { display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:6px; }
  .units span { text-align:center; padding:6px 0; border-radius:8px; background:var(--card); font-size:13px; }
  .units span.d { background:color-mix(in srgb,var(--accent) 25%,var(--card)); }
  .units span.m { background:color-mix(in srgb,var(--good) 30%,var(--card)); }
  #sync { font-size:12px; }
  textarea, select { font:inherit; font-size:16px; width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); margin:4px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .chip { width:auto; margin:0; padding:8px 12px; border-radius:999px; font-size:14px; display:inline-block; cursor:pointer; border:1px solid var(--line); background:var(--card); }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
  .thumbs span, .thumbs a { position:relative; display:inline-block; }
  .thumbs img { width:84px; height:84px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .thumbs button { position:absolute; top:0; right:4px; }
  details summary { cursor:pointer; color:var(--accent); margin:6px 0; }
  #gybtn { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); width:52px; height:52px; border-radius:50%; padding:0; text-align:center; font-size:24px; margin:0; box-shadow:0 2px 10px rgba(0,0,0,.2); z-index:10; }
  #gysheet { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .gybox { background:var(--bg); width:100%; max-width:560px; max-height:90vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #toast { position:fixed; left:16px; right:16px; bottom:84px; max-width:528px; margin:0 auto; background:var(--fg); color:var(--bg); padding:10px 14px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; }
  #toast.show { opacity:1; }
  main { padding-bottom:96px; }
  .duo { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .big2 { margin:0; text-align:center; padding:16px 8px; font-size:18px; font-weight:700; }
  .big2 small { display:block; font-size:13px; font-weight:400; margin-top:4px; opacity:.85; }
  #tabs { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--bg); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:15; }
  #tabs[hidden] { display:none; }
  #tabs button { flex:1; margin:0; border:0; border-radius:0; background:none; text-align:center; padding:10px 0 8px; font-size:15px; color:var(--mute); }
  #tabs button.on { color:var(--accent); font-weight:700; }
  body.has-tabs #gybtn { bottom:calc(72px + env(safe-area-inset-bottom)); }
  body.has-tabs #toast { bottom:140px; }
  .dims { display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; margin-top:8px; font-size:14px; }
  .okc { color:var(--good); font-weight:700; }
  .dm { opacity:.25; filter:grayscale(1); font-size:14px; } .dm.on { opacity:1; filter:none; }
  .drow { padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
</style>
</head>
<body>
<main id="app"><p class="mute">Đang tải…</p></main>
<nav id="tabs" aria-label="Mục chính" hidden><button data-tab="hoc">📘 Học</button><button data-tab="dict">📖 Từ điển</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js?v=9"></script>
<script src="gopy.js?v=9"></script>
</body>
</html>
