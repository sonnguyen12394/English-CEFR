<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học tiếng Anh</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mute:#6e6e73; --line:#e5e5ea; --card:#f5f5f7; --accent:#2a64c9; --good:#1a8f3c; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --mute:#a0a0a6; --line:#2c2c2e; --card:#1c1c1e; --accent:#5b8ff0; --good:#3fbf62; --bad:#ef5350; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 system-ui,-apple-system,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px 16px 48px; }
  h1 { font-size:22px; margin:8px 0 4px; } h2 { font-size:18px; margin:20px 0 8px; }
  .mute { color:var(--mute); font-size:14px; }
  .bar { height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin:4px 0 2px; position:relative; }
  .bar i { display:block; height:100%; border-radius:5px; }
  .bar b { position:absolute; top:0; bottom:0; width:2px; background:var(--fg); opacity:.5; }
  .box { background:var(--card); border-radius:12px; padding:14px; margin:12px 0; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:10px; padding:12px 14px; cursor:pointer; width:100%; text-align:left; margin:6px 0; }
  button.pri { background:var(--accentbg); border-color:var(--accentbg); color:#fff; text-align:center; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  button.ok { border-color:var(--good); background:color-mix(in srgb,var(--good) 15%,var(--card)); }
  button.no { border-color:var(--bad); background:color-mix(in srgb,var(--bad) 15%,var(--card)); }
  button.link { border:0; background:none; color:var(--accent); width:auto; padding:4px 0; }
  input { font:inherit; width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); margin:6px 0; }
  .big { font-size:40px; font-weight:800; letter-spacing:-.5px; } .pic { font-size:64px; line-height:1.2; }
  .q { font-size:24px; font-weight:700; margin:14px 0 6px; line-height:1.35; }
  .top { position:sticky; top:0; background:var(--bg); padding:6px 0; z-index:5; }
  .uname { font-size:14px; font-weight:600; color:var(--accent); text-align:right; max-width:70%; }
  .dots { display:flex; gap:6px; justify-content:center; margin:8px 0; }
  .dots i { width:8px; height:8px; border-radius:50%; background:var(--line); }
  .dots i.d { background:var(--good); } .dots i.c { background:var(--accent); width:20px; border-radius:4px; }
  .wcard { background:var(--card); border-radius:20px; padding:24px 16px 16px; margin:8px 0 14px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .wcard .vi { font-size:24px; font-weight:700; margin:10px 0; }
  .wcard .ex { font-size:19px; margin:12px 0; }
  .chips.say { justify-content:center; margin-top:10px; }
  .opt { font-size:19px; padding:14px 16px; }
  .emo3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .opt.emo { font-size:44px; line-height:1.15; padding:12px 0; text-align:center; }
  .tin { font-size:22px; padding:14px; text-align:center; }
  .tin.ok { border-color:var(--good); } .tin.no { border-color:var(--bad); }
  button.pri { font-size:18px; padding:14px; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .units { display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:6px; }
  .units span { text-align:center; padding:6px 0; border-radius:8px; background:var(--card); font-size:13px; }
  .units span.d { background:color-mix(in srgb,var(--accent) 25%,var(--card)); }
  .units span.m { background:color-mix(in srgb,var(--good) 30%,var(--card)); }
  #sync { font-size:12px; }
  textarea, select { font:inherit; font-size:16px; width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); margin:4px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .chip { width:auto; margin:0; padding:8px 12px; border-radius:999px; font-size:14px; display:inline-block; cursor:pointer; border:1px solid var(--line); background:var(--card); }
  .chip.on { background:var(--accentbg); border-color:var(--accentbg); color:#fff; }
  .chips.tap .chip { min-height:44px; }   /* v139: nút viên bấm bằng ngón tay (≥ 44 px), dùng ở luyện theo dạng câu */
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
  .thumbs span, .thumbs a { position:relative; display:inline-block; }
  .thumbs img { width:84px; height:84px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .thumbs button { position:absolute; top:0; right:4px; }
  details summary { cursor:pointer; color:var(--accent); margin:6px 0; }
  #gybtn { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); width:52px; height:52px; border-radius:50%; padding:0; text-align:center; font-size:24px; margin:0; box-shadow:0 2px 10px rgba(0,0,0,.2); z-index:10; }
  #gysheet { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .gybox { background:var(--bg); width:100%; max-width:560px; max-height:90vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #nsheet { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  #nsheet[hidden] { display:none; }
  #toast { position:fixed; left:16px; right:16px; bottom:84px; max-width:528px; margin:0 auto; background:var(--fg); color:var(--bg); padding:10px 14px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; }
  #toast.show { opacity:1; }
  main { padding-bottom:96px; }
  .duo { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .big2 { margin:0; text-align:center; padding:16px 8px; font-size:18px; font-weight:700; }
  .big2 small { display:block; font-size:13px; font-weight:400; margin-top:4px; opacity:.85; }
  #tabs { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--bg); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:15; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  #tabs::-webkit-scrollbar { display:none; }
  #tabs[hidden] { display:none; }
  #tabs button { flex:1 0 64px; font-size:13px !important; margin:0; border:0; border-radius:0; background:none; text-align:center; padding:6px 2px 6px; font-size:12px; line-height:1.2; color:var(--mute); white-space:nowrap; }
  #tabs button i { display:block; font-style:normal; font-size:20px; line-height:1.3; }
  #tabs button.on { color:var(--accent); font-weight:700; }
  body.has-tabs #gybtn { bottom:calc(72px + env(safe-area-inset-bottom)); }
  body.nogy #gybtn { display:none; }
  body.has-tabs #toast { bottom:140px; }
  .dims { display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; margin-top:8px; font-size:14px; }
  .dimc { cursor:pointer; border-radius:8px; padding:2px 4px; margin:-2px -4px; }
  .dimc:active { background:var(--line); }
  .dlist { margin-top:8px; font-size:15px; } .dlist .dimc { display:block; margin:4px -4px 8px; }
  .dlv { font-size:13px; font-weight:600; color:var(--mute, #888); margin:10px 0 2px; } .dlv.lock { font-weight:500; }
  .dimx { padding:3px 0; } .dimx summary { display:flex; justify-content:space-between; opacity:.5; cursor:pointer; list-style:none; } .dimx summary::-webkit-details-marker { display:none; }
  .dimx[open] summary { opacity:.85; } .dxd { font-size:14px; background:var(--bg); border-radius:8px; padding:8px 10px; margin:4px 0 6px; line-height:1.45; }
  .okc { color:var(--good); font-weight:700; }
  .dm { opacity:.25; filter:grayscale(1); font-size:14px; } .dm.on { opacity:1; filter:none; }
  .ch { border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin:8px 0; }
  .ch.cur { border-color:var(--accent); }
  .chh { border:0; background:none; padding:4px 0; margin:0; display:flex; justify-content:space-between; gap:8px; font-size:16px; }
  .urow { display:flex; justify-content:space-between; gap:8px; padding:10px 12px; margin:4px 0; font-size:16px; }
  .urow.next { border-color:var(--accent); font-weight:700; }
  .lvtag { font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; vertical-align:middle; }
  .lvtag.pre { background:color-mix(in srgb,var(--good) 20%,var(--card)); color:var(--good); }
  .lvtag.a2, .lvtag.a2p { background:color-mix(in srgb,#b8860b 20%,var(--card)); color:#b8860b; }
  .lvtag.b1, .lvtag.b2, .lvtag.b1p, .lvtag.b2p { background:color-mix(in srgb,#8e44ad 18%,var(--card)); color:#8e44ad; }
  .lvtag.c1, .lvtag.c2 { background:color-mix(in srgb,var(--bad) 18%,var(--card)); color:var(--bad); }
  .lvtag.a1 { background:color-mix(in srgb,var(--accent) 20%,var(--card)); color:var(--accent); }
  .sels { display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; margin:8px 0; }
  .sels label { font-size:13px; color:var(--mute); }
  .sels label:first-child { grid-column:1 / -1; }
  .sels select { margin:2px 0 0; padding:9px 10px; color:var(--fg); }
  .drow { padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  /* v112 giao diện trực quan (người sáng lập: "vô app nhìn thấy chữ không hiểu gì… thiết kế cho trực quan dễ hiểu dễ sử dụng"): ít chữ, hình thay chữ, mỗi màn một nút chính */
  :root { --accent2:#e8f0fe; --good2:#e6f4ea; --warn:#b26a00; --warn2:#fff4e0; --accentbg:#2a64c9; }
  @media (prefers-color-scheme: dark) { :root { --accent2:#1d2a44; --good2:#16301f; --warn:#f0a43a; --warn2:#3a2a12; --accentbg:#2f6fde; } }
  /* v142 tương phản: --accentbg = nền nút / chip đậm có chữ trắng (nền tối #5b8ff0 chỉ 3,17 : 1 → #2f6fde 4,72 : 1); --accent cho chữ, viền, chấm (nền sáng #2f6fde trên ô xám 4,33 : 1 → #2a64c9 5,1 : 1). Link dùng --accent (trước: xanh mặc định, nền tối 1,81 : 1). */
  a { color:var(--accent); }
  .hello { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .pill { display:inline-block; font-size:14px; background:var(--warn2); color:var(--warn); border-radius:999px; padding:4px 10px; font-weight:600; white-space:nowrap; }
  .ringrow { display:flex; align-items:center; gap:16px; margin:10px 0 14px; }
  button.btnbig { display:block; width:100%; border:0; border-radius:16px; padding:16px; font-size:19px; font-weight:700; text-align:center; background:var(--accentbg); color:#fff; margin:8px 0; }
  button.btnbig small { display:block; font-size:14px; font-weight:400; opacity:.92; margin-top:2px; }
  button.btnbig.ghost { background:var(--card); color:var(--fg); border:1px solid var(--line); font-weight:600; }
  .tasks { background:var(--card); border-radius:18px; padding:2px 14px; margin:8px 0 12px; }
  button.task { display:flex; align-items:center; gap:12px; width:100%; background:none; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:12px 0; margin:0; text-align:left; color:var(--fg); }
  button.task:last-child { border-bottom:0; }
  .task .c { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; background:var(--bg); border:2px solid var(--line); }
  .task.done .c { background:var(--good2); border-color:var(--good2); color:var(--good); font-weight:800; }
  .task.next .c { background:var(--accentbg); border-color:var(--accentbg); color:#fff; }
  .task .t { flex:1; min-width:0; } .task .t b { display:block; font-size:17px; } .task .t span { display:block; font-size:14px; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task.done .t b { color:var(--mute); }
  .chev { color:var(--mute); font-size:20px; flex:none; }
  button.goalcard { display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--card); border:0; border-radius:18px; padding:16px; margin:8px 0; color:var(--fg); }
  .wiz { padding-bottom:20px; } .wiz h1 { font-size:26px; line-height:1.25; margin:6px 0 4px; }
  .wdots { display:flex; gap:6px; margin:4px 0 14px; } .wdots i { width:28px; height:5px; border-radius:3px; background:var(--line); } .wdots i.on { background:var(--accent); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button.optc { border:2px solid var(--line); border-radius:18px; padding:14px; background:var(--bg); position:relative; min-height:116px; text-align:left; margin:0; width:auto; color:var(--fg); }
  button.optc .ic { font-size:32px; line-height:1; display:block; } button.optc b { display:block; font-size:17px; margin-top:8px; } button.optc .s { display:block; color:var(--mute); font-size:14px; }
  button.optc.on { border-color:var(--accent); background:var(--accent2); }
  button.optc.on::after { content:"✓"; position:absolute; top:10px; right:12px; width:24px; height:24px; border-radius:50%; background:var(--accentbg); color:#fff; font-size:15px; text-align:center; line-height:24px; font-weight:700; }
  button.optr { display:flex; align-items:center; gap:12px; border:2px solid var(--line); border-radius:16px; padding:12px 14px; background:var(--bg); margin:8px 0; color:var(--fg); }
  button.optr .ic { font-size:28px; flex:none; } button.optr b { display:block; font-size:17px; } button.optr .s { display:block; color:var(--mute); font-size:14px; }
  button.optr.on { border-color:var(--accent); background:var(--accent2); }
  .chipset { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 2px; } .chipset button { width:auto; margin:0; padding:9px 14px; border-radius:999px; background:var(--bg); }
  .chipset button.on { background:var(--accentbg); color:#fff; border-color:var(--accentbg); }
  .seg { display:flex; background:var(--card); border-radius:12px; padding:4px; margin:10px 0 12px; }
  .seg button { flex:1; width:auto; margin:0; border:0; background:none; text-align:center; padding:9px 4px; border-radius:9px; font-weight:600; font-size:16px; color:var(--mute); }
  .seg button.on { background:var(--bg); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.15); }
  button.tile { background:var(--card); border:0; border-radius:18px; padding:14px; min-height:112px; text-align:left; margin:0; width:auto; display:block; color:var(--fg); }
  .tile .ic { font-size:30px; display:block; line-height:1.1; } .tile b { display:block; font-size:17px; margin:6px 0 8px; } .tile .meta { font-size:13px; color:var(--mute); margin-top:6px; display:block; }
  .tile.ok .meta { color:var(--good); font-weight:600; } .tile.open .meta { color:var(--accent); font-weight:600; }
  .lvpath { position:relative; padding-left:38px; margin:8px 0 4px; }
  .lvpath::before { content:""; position:absolute; left:14px; top:10px; bottom:10px; width:3px; background:var(--line); border-radius:2px; }
  .lvstep { position:relative; padding:7px 0; } .lvstep .d { position:absolute; left:-38px; top:6px; width:31px; height:31px; border-radius:50%; background:var(--bg); border:3px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
  .lvstep.ok .d { background:var(--good); border-color:var(--good); color:#fff; } .lvstep.cur .d { background:var(--accentbg); border-color:var(--accentbg); color:#fff; } .lvstep.goal .d { border-color:var(--warn); background:var(--warn2); }
  .lvstep b { font-size:17px; } .lvstep span { color:var(--mute); font-size:14px; margin-left:6px; } .lvstep.cur b { color:var(--accent); }
  .split { display:flex; height:32px; border-radius:10px; overflow:hidden; font-size:14px; font-weight:700; color:#fff; } .split div { display:flex; align-items:center; justify-content:center; white-space:nowrap; overflow:hidden; }
  /* v133 một trình độ: thang cấp ở kết quả kiểm tra, số phút ở việc hôm nay, trình độ lớn ở Tiến độ, dòng chỗ yếu có nút sửa */
  .lvladder { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin:12px 0; text-align:center; font-size:12px; }
  .lvchip { padding:8px 0; border-radius:8px; background:var(--card); color:var(--mute); white-space:nowrap; overflow:hidden; } .lvchip.lo { background:var(--accent2); color:var(--accent); } .lvchip.on { background:var(--accentbg); color:#fff; font-weight:800; }
  .task .min { font-size:14px; color:var(--mute); white-space:nowrap; align-self:flex-start; margin-top:4px; }
  .task .t span { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .lvbig { display:block; font-size:40px; font-weight:800; line-height:1.1; }
  .lvlabels { display:flex; justify-content:space-between; font-size:13px; color:var(--mute); } .lvlabels .on { color:var(--accent); font-weight:700; }
  button.fixrow { display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; border-top:1px solid var(--line); border-radius:0; padding:10px 0; margin:0; text-align:left; color:var(--fg); }
  button.fixrow small { display:block; font-size:14px; color:var(--mute); } button.fixrow .go { margin-left:auto; background:var(--accentbg); color:#fff; border-radius:10px; padding:7px 12px; font-size:15px; font-weight:600; white-space:nowrap; }
  .lvstep small { display:block; color:var(--mute); font-size:14px; margin-top:2px; }
  /* v134 📚 Học một trang: thẻ "Tiếng Anh {cấp}" / "Luyện {kỳ thi}" với dòng kỹ năng (tên + số bài + trạng thái) */
  .hcard { padding:14px 14px 4px; } .hcard.ex { background:var(--warn2); }
  button.hrow { display:flex; align-items:center; gap:12px; width:100%; background:none; border:0; border-top:1px solid var(--line); border-radius:0; padding:11px 0; margin:0; text-align:left; color:var(--fg); }
  button.hrow .ic { font-size:22px; width:28px; text-align:center; flex:none; } button.hrow .t { flex:1; min-width:0; } button.hrow .t b { display:block; font-size:17px; } button.hrow .t small { display:block; font-size:14px; color:var(--mute); }
  button.hrow.ok .t small { color:var(--good); } button.hrow .chev { color:var(--mute); font-size:20px; flex:none; }
  /* v134 màn kỹ năng một kiểu: ô bài thi lên cấp, 2 ô số đo kỳ thi, dòng thi thử */
  .examc { display:flex; gap:12px; align-items:flex-start; } .examc .ic { font-size:22px; } .examc.lock { background:none; border:1px solid var(--line); } .examc.open { background:var(--accent2); } .examc.done { background:var(--good2); }
  .statc { background:var(--card); border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; } .statc b { font-size:22px; line-height:1.2; }
  .mockr { display:flex; gap:10px; align-items:center; } .mockr button { width:auto; margin:0; }
  .lsteps { padding:6px 14px; } .lsteps .ls { display:flex; gap:12px; padding:10px 0; } .lsteps .ls + .ls { border-top:1px solid var(--line); }
  .lsteps .ls i { width:28px; height:28px; border-radius:50%; background:var(--accentbg); color:#fff; font-style:normal; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
  .lsteps .ls + .ls i { background:none; border:2px solid var(--accent); color:var(--accent); } .lsteps b { display:block; } .lsteps span { display:block; font-size:14px; }
  .days10 { display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin:8px 0 4px; } .days10 i { height:24px; border-radius:7px; background:var(--line); display:block; } .days10 i.ok { background:var(--good); } .days10 i.now { background:var(--accent); }
  .ltbanner { position:sticky; top:0; z-index:6; display:flex; gap:8px; align-items:center; justify-content:space-between; background:var(--accent2); border-radius:12px; padding:6px 12px; margin:0 0 8px; }
  .ltbanner button { margin:0; }
  /* v113 màn kỳ thi (IELTS / TOEIC / Cambridge) cùng khung: hàng kỳ thi một dòng, ô điểm ước gọn */
  .chipset.ex3 { flex-wrap:nowrap; } .chipset.ex3 button { flex:1; padding:8px 2px; font-size:15px; text-align:center; white-space:nowrap; min-height:44px; }
  /* v146 🎯 Sai ở đâu · học lại gì (hoclai.js): mỗi dạng sai một dòng (tên + sai a/b + 📘 / 🏋️) ngăn bằng đường kẻ; dòng gập cao ≥ 44 px */
