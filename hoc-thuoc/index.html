  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

let L = [
  ['A', "Good morning. I'm checking out of Room 512 today, but my flight doesn't leave until nine tonight. Is a late checkout possible?", 'Chào buổi sáng. Hôm nay tôi trả phòng 512, nhưng 9 giờ tối chuyến bay của tôi mới cất cánh. Tôi trả phòng muộn được không?', 'aa4076c0c'],
  ['B', "Let me check. We're fully booked tonight, so I can only extend your checkout to two P.M.", 'Để tôi kiểm tra. Tối nay khách sạn kín phòng, nên tôi chỉ lùi giờ trả phòng của chị tới 2 giờ chiều được thôi.', 'a44b1f8df'],
  ['A', "That would help. Is there somewhere I could leave my luggage after that?", 'Vậy cũng đỡ. Sau đó tôi có thể gửi hành lý ở đâu không?', 'a3fc286bc'],
  ['B', "Of course. We can store your bags at the front desk, and you're welcome to use the business lounge until your taxi arrives.", 'Tất nhiên. Chúng tôi giữ túi của chị ở quầy lễ tân, và chị cứ dùng phòng chờ doanh nhân tới khi taxi đến.', 'a2292734a'],
  ['A', "Perfect. Could you also book a taxi to the airport for six o'clock?", 'Tuyệt. Anh đặt giúp tôi một taxi ra sân bay lúc 6 giờ được không?', 'af8d47134'],

const LAY = [['ipa', 'Phiên âm'], ['nhan', 'Nhấn âm'], ['noi', 'Nối âm'], ['nuot', 'Nuốt âm'], ['dieu', 'Ngữ điệu'], ['ngat', 'Ngắt nghỉ']];
const LAY_TIP = { ipa: 'Phiên âm Anh–Mỹ dưới mỗi từ. ˈ đứng trước âm tiết được nhấn: /ˈmɔːrnɪŋ/ nhấn MOR. Từ nhỏ đọc nhẹ: of /əv/, to /tə/.',
  nhan: '<b>Chữ đậm</b> = từ được nhấn trong câu, đọc to và rõ. Chữ xám = đọc nhẹ, nhanh.',
  noi: '<b style="color:var(--b)">‿</b> = nối âm: đọc liền hai từ. Dưới mỗi câu có cách đọc liền.',
  nuot: '✂️ ( ) trong phiên âm = âm bị nuốt: gần như không đọc hoặc không bật hơi.',
  dieu: '<b style="color:var(--a)">↘</b> xuống giọng: câu kể, câu hỏi Wh-. <b style="color:var(--acc)">↗</b> lên giọng: câu hỏi Yes / No, lời nhờ lịch sự.',
  ngat: '<b>/</b> = ngắt hơi ngắn giữa hai cụm ý.' };
st.lay = st.lay || { ipa: 1 };
const ALLF = { ipa: 1, nhan: 1, noi: 1, nuot: 1, dieu: 1, ngat: 1 };
const ipaHtml = (i, F = st.lay) => { const S = F.nhan ? new Set(STR[i]) : null, K = new Map(F.noi ? LK[i].map(x => [x[0], x]) : []);
  const E = new Map(F.nuot ? EL[i].map(x => [x[0], x]) : []), I2 = new Map(F.dieu ? INT[i] : []), P = new Set(F.ngat ? PAU[i] : []), showI = F.ipa || F.nuot;
  const W = words(L[i][1]), one = j => `<span class="${S ? (S.has(j) ? 'st' : 'un') : ''}${E.has(j) ? ' el' : ''}">${F.only ? `<span class="iw">${esc(E.has(j) ? E.get(j)[1] : IPA[i][j] || '')}</span>` : esc(W[j]) + (showI ? `<small>${F.ipa || E.has(j) ? '/' + esc(E.has(j) ? E.get(j)[1] : IPA[i][j] || '') + '/' : ''}</small>` : '')}</span>${I2.has(j) ? `<span class="int ${I2.get(j) === '↗' ? 'up' : ''}" aria-label="${I2.get(j) === '↗' ? 'lên giọng' : 'xuống giọng'}">${I2.get(j)}</span>` : ''}${P.has(j) ? '<span class="pau" aria-label="ngắt">/</span>' : ''}`, out = [];
  for (let j = 0; j < W.length; j++) { let g = one(j); while (K.has(j) && j + 1 < W.length) { j++; g += '<span class="lk" aria-label="nối âm">‿</span>' + one(j); } out.push(g.includes('class="lk"') ? `<span class="grp">${g}</span>` : g); }
  const notes = F.nonotes ? [] : [...(F.noi ? LK[i].map(x => `<span>🔗 <b>${esc(x[1])}</b> · ${esc(x[2])}</span>`) : []), ...(F.nuot ? EL[i].map(x => `<span>✂️ <b class="elb">/${esc(x[1])}/</b> · ${esc(x[2])}</span>`) : [])];
  return `<span class="ipa${showI ? '' : ' noipa'}">${out.join('')}</span>${notes.length ? `<span class="lks">${notes.join('')}</span>` : ''}`; };
const anyLay = () => LAY.some(([k]) => st.lay[k]);
const lineTxt = i => anyLay() ? ipaHtml(i) : `<span>${esc(L[i][1])}</span>`;
const ipaTg = () => `<div class="laybar" role="group" aria-label="Chọn lớp đánh dấu">${LAY.map(([k, t]) => `<button class="lay${st.lay[k] ? ' on' : ''}" data-lay="${k}" aria-pressed="${!!st.lay[k]}">${t}</button>`).join('')}</div>
  <div class="lay-ctl"><button class="link sm" data-lay="tat">Tắt hết</button><button class="link sm" data-lay="het">Bật hết</button></div>
  ${anyLay() ? `<div class="card sm laytip">${LAY.filter(([k]) => st.lay[k]).map(([k]) => `<p>• ${LAY_TIP[k]}</p>`).join('')}</div>` : ''}`;
const ipaOn = re => app.querySelectorAll('[data-lay]').forEach(b => b.onclick = () => { const k = b.dataset.lay;
  if (k === 'tat') st.lay = {}; else if (k === 'het') st.lay = { ...ALLF }; else st.lay[k] = st.lay[k] ? 0 : 1; const y = scrollY; re(); scrollTo(0, y); });
const lnHtml = (i, inner, btn) => `<div class="ln"><div class="who ${L[i][0]}" aria-label="${WHO[L[i][0]][0]}">${WHO[L[i][0]][1]}</div>${btn ? `<button class="say" data-p="${i}">${inner}</button>` : `<div class="say">${inner}</div>`}</div>`;

// ① nghe + đọc
function learn() { app.innerHTML = `${head()}<h1>${esc(BAIS[BAI_I].meta.t)}</h1><p class="mute sm">${esc(BAIS[BAI_I].meta.sub)}</p>

  <details class="card"><summary class="link" style="display:flex;align-items:center">📌 Cụm cần nhớ (${CUM.length})</summary>${CUM.map(c => `<p><b>${esc(c[0])}</b> <span class="mute">= ${esc(c[1])}</span>${c[2] ? `<br><span class="sm">${esc(c[2])}</span>` : ''}</p>`).join('')}</details>

// ② học thuộc: 3 mức che
function hideLine(t, lv, seed) { return words(t).map((w, j) => { const core = w.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, ''); if (!core) return esc(w);
  const hide = lv === 3 || (lv === 2 && (j + seed) % 3 !== 0) || (lv === 1 && (j + seed) % 3 === 1);
  if (!hide) return `<span class="w">${esc(w)}</span>`;
  const pre = w.slice(0, w.indexOf(core)), post = w.slice(w.indexOf(core) + core.length);
  return lv === 3 ? `<span class="w">${esc(pre)}<span class="fl">${esc(core[0])}</span><span class="hid" data-w="${esc(core)}">${'·'.repeat(Math.max(1, core.length - 1))}</span>${esc(post)}</span>`
    : `<span class="w">${esc(pre)}<span class="hid" data-w="${esc(core)}">${'·'.repeat(core.length)}</span>${esc(post)}</span>`; }).join(' '); }
function memo() { const lv = st.lv || 1, D = ['Che 1/3 số từ', 'Che 2/3 số từ', 'Chỉ còn chữ đầu'];
  app.innerHTML = `${head('Đọc to từng câu, tự nhớ chữ bị che. Quên thì chạm ô xám để nhìn. Chạm 🔊 để nghe lại rồi nhại theo.')}
  <div class="seg" role="group" aria-label="Mức che">${D.map((d, i) => `<button data-lv="${i + 1}" aria-pressed="${lv === i + 1}">${d}</button>`).join('')}</div>
  <div class="card">${L.map((l, i) => `<div class="ln"><div class="who ${l[0]}">${WHO[l[0]][1]}</div><div class="say"><span>${hideLine(l[1], lv, i)}</span><div class="row"><button class="link sm" data-p="${i}">🔊 Nghe câu này</button><button class="link sm" data-ipa="${i}">Xem phiên âm</button></div><div id="pa${i}" hidden></div></div></div>`).join('')}</div>
  <button class="pri" id="nx">${lv < 3 ? `Mức tiếp: ${D[lv]}` : 'Xong, về bài học ›'}<small>${lv < 3 ? `mức ${lv}/3` : 'đã đọc đủ 3 mức'}</small></button>`;
  app.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { st.lv = +b.dataset.lv; memo(); });
  app.querySelectorAll('.hid').forEach(h => h.onclick = () => { h.classList.toggle('peek'); h.textContent = h.classList.contains('peek') ? h.dataset.w.slice(h.previousElementSibling && h.previousElementSibling.classList.contains('fl') ? 1 : 0) : '·'.repeat(h.dataset.w.length); });
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => play(+b.dataset.p));
  app.querySelectorAll('[data-ipa]').forEach(b => b.onclick = () => { const i = +b.dataset.ipa, d = document.getElementById('pa' + i); d.hidden = !d.hidden; if (!d.hidden) d.innerHTML = ipaHtml(i, anyLay() ? st.lay : ALLF); b.textContent = d.hidden ? 'Xem phiên âm' : 'Ẩn phiên âm'; });
  $('#nx').onclick = () => { if (lv < 3) { st.lv = lv + 1; memo(); scrollTo(0, 0); } else fin('che'); }; }

function cloze() { const used = new Set(), fill = {}; let k = 0;
  const lineHtml = i => { let t = esc(L[i][1]); for (const [j, ph] of CLOZE.map((c, j) => [j, c]).filter(([, c]) => c[0] === i)) t = t.replace(esc(ph[1]), `<span class="gap" id="g${j}">${fill[j] ? esc(fill[j]) : (j + 1)}</span>`); return t; };
  const draw = () => { app.innerHTML = `${head('Điền cụm vào đoạn vừa thuộc. Chạm cụm theo thứ tự chỗ trống 1 → 6.')}
    <div class="card">${[1, 2, 3, 4].map(i => lnHtml(i, `<span>${lineHtml(i)}</span>`)).join('')}</div>
    <div class="bank">${shuf(CLOZE.map(c => c[1])).map(w => `<button data-w="${esc(w)}" ${used.has(w) ? 'disabled' : ''}>${esc(w)}</button>`).join('')}</div><div id="fb"></div>`;
    app.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const w = b.dataset.w; if (w === CLOZE[k][1]) { fill[k] = w; used.add(w); k++; st.hit[0]++; st.hit[1]++;
        if (k === CLOZE.length) { draw(); $('#fb').innerHTML = `<div class="fb ok">✓ Đủ 6 chỗ trống.</div><button class="pri" id="nx" style="margin-top:10px">Xong ›</button>`; $('#nx').onclick = () => fin('dien', [st.hit[0], st.hit[1]]); } else draw(); }
      else { st.hit[1]++; $('#fb').innerHTML = `<div class="fb no">Chỗ trống ${k + 1} không phải “${esc(w)}”. Đọc lại câu, thử cụm khác.</div>`; } }); };
  draw(); }
function order() { const want = L.map((_, i) => i), picked = [], bag = shuf(want);
  const draw = msg => { app.innerHTML = `${head('Xếp 6 câu theo đúng thứ tự hội thoại. Chạm câu đến trước.')}
    <div class="card">${picked.length ? picked.map(i => lnHtml(i, `<span>${esc(L[i][1])}</span>`)).join('') : '<p class="mute sm">Câu bạn chọn sẽ hiện ở đây.</p>'}</div>
    <div class="opts">${bag.filter(i => !picked.includes(i)).map(i => `<button class="opt" data-o="${i}"><span class="sm mute">${WHO[L[i][0]][0]}:</span> ${esc(L[i][1])}</button>`).join('')}</div><div id="fb">${msg || ''}</div>`;
    app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { const i = +b.dataset.o; st.hit[1]++; if (i === picked.length) { picked.push(i); st.hit[0]++;
        if (picked.length === L.length) { draw('<div class="fb ok">✓ Đúng thứ tự.</div><button class="pri" id="nx" style="margin-top:10px">Xong ›</button>'); $('#nx').onclick = () => fin('xep', [st.hit[0], st.hit[1]]); } else draw(); }
      else draw('<div class="fb no">Chưa phải câu này. Nghĩ xem người nào nói tiếp và trả lời điều gì.</div>'); }); };
  draw(); }
const MCQ_SUB = { dang: 'Câu của bài bỏ trống, chọn dạng đúng.', gotv: 'Gõ từ còn thiếu theo nghĩa gợi ý.', ds: 'Đọc câu, chọn Đúng hoặc Sai.', ghep: '', tu: 'Chọn nghĩa đúng của phần tô màu trong câu của bài.', np: 'Phần tô màu dùng ngữ pháp gì, vì sao?', de: 'Trả lời như khi thi.', moi: 'Câu chưa gặp, dùng lại cụm vừa học. Đúng là hiểu, không phải nhớ vẹt.' };
function mcq(Qs, k) { const it = Qs[st.i], ord = it.ord || (it.ord = shuf(it.o.map((_, j) => j)));
  app.innerHTML = `${head(MCQ_SUB[k])}<p class="tag">Câu ${st.i + 1}/${Qs.length}</p>${it.s ? `<div class="card ctx"><span class="sm mute">Trong bài:</span><span>“${esc(it.s).replace(/\[\[(.+?)\]\]/, '<mark>$1</mark>')}”</span></div>` : ''}<p class="q">${esc(it.q).replace('___', '<span class="gap">?</span>')}</p>
    <div class="opts">${ord.map(j => `<button class="opt" data-j="${j}">${esc(it.o[j])}</button>`).join('')}</div><div id="fb"></div>`;
  app.querySelectorAll('[data-j]').forEach(b => b.onclick = () => { const j = +b.dataset.j, ok = j === it.a; st.hit[1]++; if (ok) st.hit[0]++;
    app.querySelectorAll('[data-j]').forEach(x => { const kk = +x.dataset.j; x.disabled = true; if (kk === it.a) x.classList.add('ok'); else if (kk === j) x.classList.add('no'); });
    $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? '✓ Đúng.' : '✗ Chưa đúng.'} ${esc(it.vi)}${it.nen ? `<br><span class="sm">🧱 Bài Nền liên quan: <b>${esc(it.nen)}</b></span>` : ''}</div><button class="pri" id="nx" style="margin-top:10px">${st.i + 1 < Qs.length ? 'Câu tiếp ›' : 'Xong ›'}</button>`;
    $('#nx').onclick = () => { st.i++; scrollTo(0, 0); if (st.i < Qs.length) mcq(Qs, k); else { Qs.forEach(q => delete q.ord); fin(k, [st.hit[0], st.hit[1]]); } }; }); }


// ---------- v3 Tập nhớ có nhiều thao tác (người sáng lập: "thiết kế sao cho tôi gõ hoặc bấm nhiều hỗ trợ việc nhớ") ----------
const cleanW = w => w.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9'.]+$/g, '').replace(/\.$/, '');
// 👆 xếp từ thành câu: từng câu, bấm từ theo thứ tự; bấm sai thì từ rung đỏ
function xeptu() { const i = st.i, W = words(L[i][1]); let k = 0; const chips = shuf(W.map((w, j) => ({ w, j })));
  const draw = msg => { app.innerHTML = `${head(`Câu ${i + 1}/${L.length}. Bấm từng từ theo đúng thứ tự. Gợi ý nghĩa ở trên.`)}
    <div class="card">${lnHtml(i, `<span class="sm mute">${esc(L[i][2])}</span><span class="built">${W.slice(0, k).map(esc).join(' ')}<span class="cursor">▌</span></span>`)}</div>
    <div class="bank">${chips.map((c, n) => `<button data-c="${n}" ${c.used ? 'disabled' : ''}>${esc(c.w)}</button>`).join('')}</div><div id="fb">${msg || ''}</div>`;
    app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const c = chips[+b.dataset.c]; st.hit[1]++;
      if (c.w === W[k]) { c.used = 1; k++; st.hit[0]++; if (k === W.length) { play(i); draw(`<div class="fb ok">✓ Đúng cả câu.</div><button class="pri" id="nx" style="margin-top:10px">${i + 1 < L.length ? 'Câu tiếp ›' : 'Xong ›'}</button>`);
          $('#nx').onclick = () => { st.i++; scrollTo(0, 0); st.i < L.length ? xeptu() : fin('xeptu', [st.hit[0], st.hit[1]]); }; } else draw(); }
      else { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400); } }); };
  draw(); }
// ⌨️ gõ từ còn thiếu: câu che ~1/3 từ (từ có nghĩa trước), gõ vào ô; Kiểm tra tô xanh / đỏ
const GOTU = L.map((l, i) => words(l[1]).map((w, j) => { const c = cleanW(w); return c.length > 2 && (j + i) % 3 === 1 ? j : -1; }).filter(j => j >= 0));
function gotu() { const i = st.i, W = words(L[i][1]), H = new Set(GOTU[i]);
  app.innerHTML = `${head(`Câu ${i + 1}/${L.length}. Gõ các từ bị che. Gõ xong một ô, nhảy sang ô sau.`)}
    <div class="card">${lnHtml(i, `<span class="sm mute">${esc(L[i][2])}</span><span class="gtl">${W.map((w, j) => { if (!H.has(j)) return esc(w); const c = cleanW(w), post = w.slice(w.indexOf(c) + c.length);
      return `<input class="gti" data-a="${esc(c)}" size="${Math.max(3, c.length)}" style="width:${Math.max(3, c.length) + 1.2}ch" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="từ còn thiếu">${esc(post)}`; }).join(' ')}</span>`)}</div>
    <button class="pri" id="ck">Kiểm tra</button><button class="link" id="hint" style="align-self:center">💡 Hiện chữ cái đầu</button><div id="fb"></div>`;
  const I = [...app.querySelectorAll('.gti')]; I[0] && I[0].focus();
  I.forEach((x, n) => x.addEventListener('input', () => { if (norm(x.value) === norm(x.dataset.a) && I[n + 1]) I[n + 1].focus(); }));
  $('#hint').onclick = () => I.forEach(x => { if (!x.value) x.placeholder = x.dataset.a[0] + '…'; });
  $('#ck').onclick = () => { let ok = 0; I.forEach(x => { const g = norm(x.value) === norm(x.dataset.a); if (g) ok++; else x.value = x.dataset.a; x.classList.add(g ? 'gok' : 'gno'); x.disabled = true; });
    st.hit[0] += ok; st.hit[1] += I.length; play(i); $('#ck').hidden = true; $('#hint').hidden = true;
    $('#fb').innerHTML = `<div class="fb ${ok === I.length ? 'ok' : 'no'}">${ok}/${I.length} từ đúng. ${ok < I.length ? 'Ô đỏ đã điền đáp án, đọc to lại câu.' : ''}</div><button class="pri" id="nx" style="margin-top:10px">${i + 1 < L.length ? 'Câu tiếp ›' : 'Xong ›'}</button>`;
    $('#nx').onclick = () => { st.i++; scrollTo(0, 0); st.i < L.length ? gotu() : fin('gotu', [st.hit[0], st.hit[1]]); }; }; }
// ⌨️ gõ chữ cái đầu: cả đoạn, mỗi từ chỉ gõ chữ cái đầu; đúng thì từ hiện, sai 2 lần thì hiện đỏ và đi tiếp
function chudau() { const all = L.flatMap((l, i) => words(l[1]).map(w => ({ i, w, f: (cleanW(w)[0] || '').toLowerCase() }))); let k = 0, miss = 0, ok = 0; const bad = new Set();
  const draw = () => { const cur = all[k];
    app.innerHTML = `${head('Gõ chữ cái đầu của từ tiếp theo. Đúng thì từ hiện ra. Sai 2 lần thì từ hiện đỏ để nhớ lại.')}
      <div class="row" style="justify-content:space-between"><span class="tag">Từ ${Math.min(k + 1, all.length)}/${all.length}</span><span class="tag">Đúng ngay ${ok}</span></div>
      <div class="card cdau">${L.map((l, i) => `<div class="ln"><div class="who ${l[0]}">${WHO[l[0]][1]}</div><div class="say">${all.map((x, n) => [x, n]).filter(([x]) => x.i === i).map(([x, n]) => n < k ? `<span class="${bad.has(n) ? 'cbad' : 'cok'}">${esc(x.w)}</span>` : n === k ? `<span class="ccur">${'_'.repeat(Math.min(6, cleanW(x.w).length || 1))}</span>` : `<span class="cto">${'_'.repeat(Math.min(6, cleanW(x.w).length || 1))}</span>`).join(' ')}</div></div>`).join('')}</div>
      ${k < all.length ? `<input id="cin" class="cin" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Gõ chữ cái đầu ở đây" aria-label="Gõ chữ cái đầu">
        <button class="link" id="skip" style="align-self:center">Không nhớ, hiện từ này</button>`
      : `<div class="fb ${ok / all.length >= .9 ? 'ok' : 'no'}">Xong: ${ok}/${all.length} từ nhớ ngay (${Math.round(ok / all.length * 100)}%). Từ đỏ là chỗ cần ôn.</div><button class="pri" id="nx">Xong ›</button>`}`;
    const inp = $('#cin'); if (inp) { inp.focus(); const sc = app.querySelector('.ccur'); sc && sc.scrollIntoView({ block: 'center' });
      inp.oninput = () => { const ch = inp.value.slice(-1).toLowerCase(); inp.value = ''; if (!ch.trim()) return;
        if (ch === cur.f) { if (!miss) ok++; k++; miss = 0; draw(); }
        else { miss++; inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 350); if (miss >= 2) { bad.add(k); k++; miss = 0; draw(); } } };
      $('#skip').onclick = () => { bad.add(k); k++; miss = 0; draw(); }; }
    else $('#nx').onclick = () => fin('chudau', [ok, all.length]); };
  draw(); }

// ---------- 🇻🇳 nhớ nghĩa ----------
const fold = t => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const enCard = i => lnHtml(i, `<span>${esc(L[i][1])}</span><button class="link sm" data-p="${i}" style="align-self:flex-start">🔊 Nghe câu này</button>`);

          $('#nx').onclick = () => { st.i++; scrollTo(0, 0); st.i < L.length ? xepvn() : fin('xepvn', [st.hit[0], st.hit[1]]); }; } else draw(); }

// ⌨️ gõ nghĩa còn thiếu: câu dịch che từ khoá; gõ không dấu cũng tính đúng

// ---------- v5 Tập nhớ (người sáng lập: "bỏ hết bài nhớ; tiếng Anh thì gõ lại, tiếng Việt thì chọn theo thứ tự; làm lại miết tới khi đúng hết") ----------
// Lượt: 6 câu theo thứ tự; câu sai vào cuối hàng đợi; hết hàng đợi = thuộc. Điểm = số câu đúng ngay lần đầu / 6.
const EXP = { "i'm": 'i am', "we're": 'we are', "you're": 'you are', "doesn't": 'does not', "i'll": 'i will', "let's": 'let us', "that's": 'that is', "it's": 'it is', "can't": 'cannot', "don't": 'do not' };
const toks = t => String(t).toLowerCase().replace(/[’‘]/g, "'").replace(/\./g, '').split(/[^a-z0-9']+/).filter(Boolean).flatMap(w => (EXP[w] || w).split(' '));
let LP = null;
function loop(k) { LP = { k, q: L.map((_, i) => i), first: {}, round: 1, done: 0, seen: 0 }; next(); }
function next() { if (!LP.q.length) return loopEnd(); const i = LP.q[0]; LP.k === 'golai' ? golai(i) : LP.k === 'noipa' ? noipa(i) : chonvn(i); }
function loopTop() { return `${head()}<div class="row" style="justify-content:space-between"><span class="tag">${LP.seen >= L.length ? 'Làm lại câu sai' : 'Lượt đầu'}</span><span class="tag">Còn ${LP.q.length} câu</span></div>
  <div class="bar"><i style="width:${LP.done / L.length * 100}%"></i></div>`; }
function loopNext(i, ok) { LP.q.shift(); LP.seen++; if (LP.first[i] == null) LP.first[i] = ok; if (ok) LP.done++; else LP.q.push(i); scrollTo(0, 0); next(); }
function loopEnd() { const n = Object.values(LP.first).filter(Boolean).length;
  app.innerHTML = `${head()}<div class="card" style="text-align:center;align-items:center"><p class="tag">Xong</p><p class="big">6/6</p><h2>Đúng hết 6 câu</h2>
    <p class="mute sm">Đúng ngay lần đầu: ${n}/6 câu.${n < 6 ? ' Câu sai đã được làm lại tới khi đúng.' : ''}</p></div><button class="pri" id="nx">Về bài học ›</button>`;
  $('#nx').onclick = () => fin(LP.k, [n, L.length]); }
// 🇬🇧 gõ lại tiếng Anh: nhìn nghĩa + nghe; đúng = đủ và đúng thứ tự mọi từ (viết hoa, dấu câu, I'm = I am không tính)
function golai(i) { const l = L[i];
  app.innerHTML = `${loopTop()}<div class="card">${lnHtml(i, `<span>${esc(l[2])}</span><button class="link sm" data-p="${i}" style="align-self:flex-start">🔊 Nghe câu tiếng Anh</button>`)}</div>
    <label for="wt" class="sm mute">Gõ lại câu tiếng Anh</label><textarea id="wt" autocapitalize="sentences" autocomplete="off" spellcheck="false"></textarea>
    ${st.day ? '' : '<button class="link" id="hint" style="align-self:center">💡 Gợi ý chữ cái đầu</button><p class="sm mute" id="hn" hidden></p>'}

  app.querySelector('[data-p]').onclick = () => play(i);

  $('#ck').onclick = () => { const want = toks(l[1]), got = toks($('#wt').value), ok = want.length === got.length && want.every((w, n) => w === got[n]), r = diff(l[1], $('#wt').value);
    $('#ck').hidden = true; if (h) h.hidden = true; $('#wt').disabled = true; play(i);
    $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? '✓ Đúng cả câu.' : '✗ Chưa đúng. Câu này sẽ quay lại cuối lượt.'}</div>
      ${ok ? '' : `<div class="card"><p class="sm mute">Câu đúng (xanh: bạn đã gõ · đỏ: thiếu / sai):</p><p class="diff">${r.html}</p></div>`}
      <button class="pri" id="nx" style="margin-top:10px">Tiếp ›</button>`;
    $('#nx').onclick = () => loopNext(i, ok); }; }
// 🇻🇳 chọn nghĩa theo thứ tự: bấm cụm tiếng Việt; bấm sai một lần là câu phải làm lại
function chonvn(i) { const W = VNK[i]; let k = 0, miss = 0; const chips = shuf(W.map(w => ({ w })));
  const draw = msg => { app.innerHTML = `${loopTop()}<div class="card">${lnHtml(i, `<span>${esc(L[i][1])}</span><button class="link sm" data-p="${i}" style="align-self:flex-start">🔊 Nghe</button>`)}
      <p class="built">${W.slice(0, k).map(esc).join(' ')}<span class="cursor">▌</span></p></div>
    <p class="sm mute">Bấm cụm tiếng Việt theo đúng thứ tự.</p><div class="bank">${chips.map((c, n) => `<button data-c="${n}" ${c.used ? 'disabled' : ''}>${esc(c.w)}</button>`).join('')}</div><div id="fb">${msg || ''}</div>`;

          draw(`<div class="fb ${ok ? 'ok' : 'no'}">${ok ? '✓ Đúng ngay.' : `Xong câu, nhưng bấm sai ${miss} lần. Câu này sẽ quay lại cuối lượt.`}</div><button class="pri" id="nx" style="margin-top:10px">Tiếp ›</button>`);

// ---------- v6 🗣 Nói theo phiên âm (người sáng lập: "lấy các phần phiên âm để tôi nói vào, tự nhận hiện chữ ra") ----------
// Màn chỉ hiện phiên âm (chữ tiếng Anh ẩn, mở được). Lời nói thành chữ: nút 🎤 của trang (capability dictation, chỉ Chrome / app máy tính)

// v8 (ảnh iPhone: kéo lên xem hướng dẫn thì bàn phím che ô nhập): khi gõ, ô hướng dẫn thu lại vừa phần màn trên bàn phím
// và cuộn bên trong ô; ô nhập nằm ngay dưới. Bàn phím đóng thì ô hướng dẫn trở lại đủ cao.
function guideFit() { const t = $('#st'), g = app.querySelector('.guide'); if (!t || !g) return; const vv = window.visualViewport;
  const fit = () => { if (!document.body.contains(t)) { if (vv) vv.removeEventListener('resize', fit); return; }
    if (document.activeElement !== t) { g.style.maxHeight = ''; g.classList.remove('scroll'); return; }
    const TOPGAP = 64, H = vv ? vv.height : innerHeight, room = Math.max(140, H - t.offsetHeight - 24 - TOPGAP);   // chừa chỗ cho nút ✕ ••• của app Claude đè mép trên
    g.style.maxHeight = room + 'px'; g.classList.add('scroll');
    const top = g.getBoundingClientRect().top + scrollY - (vv ? vv.offsetTop : 0) - TOPGAP; scrollTo(0, Math.max(0, top)); };
  t.addEventListener('focus', () => { setTimeout(fit, 50); setTimeout(fit, 350); });
  t.addEventListener('blur', () => setTimeout(fit, 50));
  if (vv) vv.addEventListener('resize', fit); }

function typeFit() { const t = $('#st'), row = app.querySelector('.inrow'), g = app.querySelector('.guide'), vv = window.visualViewport; if (!t || !g) return;

    if (document.activeElement !== t) { g.style.maxHeight = ''; return; }

function noipa(i) {   // v9: ô nhập + Kiểm tra ở đầu màn, ô hướng dẫn ngay dưới. v10 (người sáng lập, ảnh iPhone: "muốn tắt bật phần phiên âm này"):

    <div class="inrow"><textarea id="st" rows="2" autocomplete="off" spellcheck="false" aria-label="Chữ máy nghe được" placeholder="Bấm 🎤 trên bàn phím rồi đọc"></textarea>

      off.forEach(f => f()); off = [DIC.onFinal(({ text }) => { const t = $('#st'); if (t) t.value = (t.value + text).trimStart(); }),

  $('#ck').onclick = () => { const said = $('#st').value, want = toks(L[i][1]), got = toks(said); let p = 0, hit = 0;

// Nhìn câu tiếng Anh, nói (micro bàn phím tiếng Việt) hoặc gõ nghĩa tiếng Việt. Chấm theo Ý CHÍNH của mỗi câu (VNY, mỗi ý vài cách nói), bỏ dấu khi so,
// ý nào có trong ô là xanh, không cần đúng thứ tự. Đồng hồ từ chữ đầu tới khi mọi ý xanh; kỷ lục riêng. ↵ bỏ qua ý đầu tiên chưa xanh (không tính kỷ lục).
let dvBestGet = () => { try { return +localStorage.getItem('dvBest' + BAI_SUF()) || 0; } catch (e) { return 0; } };
let dvBestSet = v => { try { localStorage.setItem('dvBest' + BAI_SUF(), v); } catch (e) {} };
let DV = null, DV_PL = 0, DV_RAF = 0;
// v32 (người sáng lập, ảnh iPhone 00:09: "phần dịch tiếng Việt cho câu sẵn để tôi chọn sắp xếp cho nhanh"): bỏ ô nhập; mỗi câu tiếng Anh, bấm các cụm
// tiếng Việt (VNK) theo đúng thứ tự, lẫn 1 cụm nhiễu của câu khác. Bấm sai: cụm rung đỏ, phạt DV_PEN giây. Đồng hồ chạy từ lần bấm đầu tới hết bài.
const DV_PEN = 2000, DV_X = 2;   // DV_X cụm lạ mỗi câu (người sáng lập: "cho 2 cụm lạ")
function duavn() { DV = DV || { best: dvBestGet(), n: 0, first: null }; scrollTo(0, 0);
  app.innerHTML = `${head()}<div class="card"><p><b>Nhìn câu tiếng Anh, bấm các cụm nghĩa tiếng Việt theo đúng thứ tự.</b> Xong câu này sang câu sau, tới hết bài.</p>
    <p class="sm mute">Có 2 cụm lạ của câu khác để bẫy. Bấm sai bị cộng ${DV_PEN / 1000} giây. Chạm 🔊 để nghe câu.</p>
    <p>⏱ Nhanh nhất: <b>${DV.best ? dgClock(DV.best) : 'chưa có'}</b></p></div>
    <button class="pri" id="go" style="margin-top:12px">▶ Bắt đầu</button>${sibNav('duavn')}`;
  $('#go').onclick = dvRound; }
function dvRound() { cancelAnimationFrame(DV_RAF); scrollTo(0, 0); let i = 0, k = 0, t0 = performance.now(), pen = 0, bad = 0, over = false, chips = [];
  const deal = () => { const own = VNK[i].map((t, j) => ({ t, j })), others = VNK.flatMap((c, n) => n === i ? [] : c).filter(t => !VNK[i].includes(t)), xs = shuf([...new Set(others)]).slice(0, DV_X);
    chips = shuf([...own, ...xs.map(t => ({ t, j: -1 }))]); k = 0; };
  const draw = msg => { app.innerHTML = `${head()}<div class="row" style="justify-content:space-between"><span class="tag">Câu ${i + 1}/${L.length}${DV.best ? ` · kỷ lục ${dgClock(DV.best)}` : ''}</span><span class="dgclock" id="dvclk">⏱ ${dgClock(performance.now() - t0 + pen)}</span></div>
    <div class="bar"><i style="width:${i / L.length * 100}%"></i></div>
    <div class="card">${lnHtml(i, `<span>${esc(L[i][1])}</span><button class="link sm" data-p="${i}" style="align-self:flex-start">🔊 Nghe câu này</button>`)}
      <p class="built dvbuilt">${VNK[i].slice(0, k).map(esc).join(' ')}<span class="cursor">▌</span></p></div>
    <div class="bank">${chips.map((c, n) => `<button data-c="${n}" ${c.used ? 'disabled' : ''}>${esc(c.t)}</button>`).join('')}</div><div id="fb">${msg || ''}</div>
    ${i ? `<details class="card"><summary class="link" style="display:flex;align-items:center">✓ ${i} câu đã xếp</summary>${L.slice(0, i).map(l => `<p class="sm"><b>${esc(l[1])}</b><br>${esc(l[2])}</p>`).join('')}</details>` : ''}`;
    $('[data-p]').onclick = () => play(i);
    app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const c = chips[+b.dataset.c];
      if (c.j === k) { c.used = 1; k++; if (k < VNK[i].length) return draw();
        if (++i < L.length) { deal(); return draw(); } return end(); }
      bad++; pen += DV_PEN; b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400); }); };
  const end = () => { over = true; cancelAnimationFrame(DV_RAF); const ms = performance.now() - t0 + pen, rec = !DV.best || ms < DV.best, old = DV.best; if (rec) { DV.best = ms; dvBestSet(ms); } if (DV.first == null) DV.first = !bad;
    app.innerHTML = `${head()}<div class="card" style="text-align:center;align-items:center"><p class="tag">Xong cả bài</p><p class="big">${dgClock(ms)}</p>
      <p>${rec ? '🏆 Kỷ lục mới!' + (old ? ` Nhanh hơn ${((old - ms) / 1000).toFixed(1)} giây.` : '') : `Kỷ lục vẫn là ${dgClock(old)}.`}</p><p class="sm mute">${bad ? `Bấm sai ${bad} lần (đã cộng ${bad * DV_PEN / 1000} giây).` : 'Không bấm sai lần nào.'}</p></div>
      <details class="card"><summary class="link" style="display:flex;align-items:center">📖 Xem lại cả bài và nghĩa</summary>${L.map(l => `<p class="sm"><b>${esc(l[1])}</b><br>${esc(l[2])}</p>`).join('')}</details>
      <button class="pri" id="nx" style="margin-top:10px">↻ Làm lại, phá kỷ lục</button><button class="sec" id="stop" style="margin-top:8px">Xong, về bài học</button>${sibBtn('duavn')}`;
    $('#nx').onclick = () => { DV.n++; dvRound(); }; $('#stop').onclick = () => fin('duavn', [DV.first ? 1 : 0, 1]); };
  const tick = () => { if (over) return; const e = document.getElementById('dvclk'); if (!e) return; e.textContent = '⏱ ' + dgClock(performance.now() - t0 + pen); DV_RAF = requestAnimationFrame(tick); };
  deal(); draw(); DV_RAF = requestAnimationFrame(tick); }
